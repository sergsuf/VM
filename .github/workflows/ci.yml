name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Syntax and lint checks
        run: |
          python tests/e2e/run_e2e.py --check-syntax
          ruff check remote packaging tests

      - name: Run unit tests (unittest)
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run test suite (pytest)
        run: |
          pytest -q

      - name: Packaging smoke checks
        run: |
          python packaging/build_app_update.py --version 0.2.0 --out-dir "${{ runner.temp }}/app_update_smoke"
          python packaging/build_portable_client.py --version 0.2.0 --out-dir "${{ runner.temp }}/portable_smoke" --offline
