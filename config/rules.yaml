# Configuration for 3ds Max (2025/2027) popup watcher & AHK automation

target_processes:
  - "3dsmax"
  - "AdskLicensingAgent"
  - "AdskIdentityManager"
  - "AdSSO"
  - "AdskAccess"
  - "Autodesk"
  - "MAXScript"

# Windows that represent the main 3ds Max workspace (never treated as unknown popups)
ignore_windows:
  - name: "Main 3ds Max Workspace"
    title_regex: "^(Untitled|.*\\.max)\\s*-\\s*Autodesk 3ds Max (2025|2027)"
  - name: "Privacy Settings Inner WebView Host"
    process_contains: "3dsmax"
    title_regex: "^$"
    text_contains: ["Privacy Settings"]

# Ordered list of popup handling rules (first match wins)
rules:
  - name: "Privacy / Data Collection Consent"
    process_contains: "3dsmax"
    title_regex: "^3dsmax$"
    text_contains: ["We care about your privacy", "Required data collection"]
    action:
      type: "click_control"
      automation_id: "1002"
      control_names: ["OK", "I Agree", "Agree", "Accept", "Continue", "Close"]
    cooldown_sec: 3

  - name: "Privacy Settings (3ds Max 2027 WebView)"
    process_contains: "3dsmax"
    title_regex: "^3dsMax/2027"
    text_contains: ["Privacy Settings"]
    action:
      type: "click_relative"
      rel_x: 0.88
      rel_y: 0.94
    cooldown_sec: 3

  - name: "EULA / License Agreement"
    title_regex: "(?i)(license agreement|end user|eula|terms of use)"
    action:
      type: "click_control"
      control_names: ["I Agree", "Agree", "Accept", "Next", "Continue"]
    cooldown_sec: 3

  - name: "Color Management / Theme Prompt (Don't show again + Continue)"
    process_contains: "3dsmax"
    title_regex: "^3dsmax$"
    text_contains: ["Heads Up!", "Color Management", "Don't show again"]
    action:
      type: "sequence"
      steps:
        - type: "click_control"
          control_names: ["Don't show again", "Do not show again", "Don't show this again"]
          delay_after_sec: 0.3
        - type: "click_control"
          control_names: ["Continue", "OK", "Close"]
    cooldown_sec: 3

  - name: "Welcome / What's New Screen"
    run_before_ignore: true
    process_contains: "3dsmax"
    text_contains: ["Show this Welcome Screen at startup", "Welcome to 3ds Max"]
    action:
      type: "sequence"
      steps:
        - type: "click_control"
          automation_id: "WelcomeScreenDialog.mShowWelcomeScreenBox"
          control_names: ["Show this Welcome Screen at startup"]
          state: 0
          delay_after_sec: 0.3
        - type: "click_control"
          automation_id: "WelcomeScreenDialog.closeButton"
          control_names: ["x", "Close", "Skip", "Continue", "Start 3ds Max", "OK"]
    cooldown_sec: 3

  - name: "3ds Max Security / Safe Scene Messages (Close QMessageWidget)"
    run_before_ignore: true
    process_contains: "3dsmax"
    action:
      type: "click_control"
      automation_id: "QMessageWidget.closePushButton"
    cooldown_sec: 3

  - name: "3ds Max Security / Untrusted Script Warning"
    title_regex: "(?i)(security|untrusted|safe scene|script)"
    text_contains: ["script", "trust", "security"]
    action:
      type: "click_control"
      control_names: ["Load", "Allow", "Run", "Yes", "OK", "Continue"]
    cooldown_sec: 2

  - name: "3ds Max License Startup Error (OK)"
    process_contains: "3dsmax"
    title_regex: "(?i)^License Startup Error$"
    text_contains: ["problem with the software license"]
    action:
      type: "click_control"
      control_names: ["OK"]
    cooldown_sec: 3

  - name: "Generic Error / Warning / Missing Plugin Dialog"
    process_contains: "3dsmax"
    title_regex: "(?i)(warning|error|missing|dll|plugin|maxscript)"
    action:
      type: "click_control"
      control_names: ["OK", "Continue", "Ignore", "Yes", "Close"]
    cooldown_sec: 2

  - name: "Autodesk Licensing - Specify a license server (Close)"
    process_contains: "AdskLicensingAgent"
    title_regex: "(?i)WebView2 WebBrowser"
    text_contains: ["Specify a license server", "Server Name"]
    action:
      type: "close"
    cooldown_sec: 5

  - name: "Autodesk Licensing - Let's Get Started (UIA Select)"
    process_contains: "AdskLicensingAgent"
    title_regex: "(?i)WebView2 WebBrowser"
    text_contains: ["Untitled", "Clic LGS"]
    action:
      type: "click_control"
      automation_id: "btn-select-nw"
      control_names: ["Select"]
    cooldown_sec: 5

  - name: "Autodesk Licensing - Let's Get Started (Relative Fallback)"
    process_contains: "AdskLicensingAgent"
    title_regex: "(?i)WebView2 WebBrowser"
    text_contains: ["Untitled", "Clic LGS"]
    action:
      type: "click_relative"
      rel_x: 0.66
      rel_y: 0.76
    cooldown_sec: 5

  - name: "Autodesk Sign-In / Identity Prompt (Dismiss if offline/testing)"
    process_contains: "AdskIdentityManager"
    title_regex: ".*"
    action:
      type: "click_control"
      control_names: ["Continue", "Next", "Skip", "Cancel", "Close"]
    cooldown_sec: 5
