# Example configuration for the Remote 3ds Max Client Agent

connection:
  mode: direct
  server_url: "http://127.0.0.1:8765"
  session_id: "S-EXAMPLE"
  token: "REPLACE_WITH_PAIRING_TOKEN"

paths:
  data_dir: "%LOCALAPPDATA%\\MaxAgent\\data"
  iso_dir: "C:\\Install"
  assets_dir: "C:\\Install\\assets"
  rules_config: "config/rules.yaml"
  post_config: "config/post_config.yaml"

runtime:
  driver: auto
  status_port: 8770
  headless: false
  auto_resume_download: true
  heartbeat_interval_sec: 10
  poll_wait_sec: 25

max:
  target_version: "2025"
  supported_versions: ["2024", "2025", "2026", "2027", "2028"]
  install_timeout_sec: 2400
  first_run_timeout_sec: 300
  post_config_step_timeout_sec: 600

security:
  defender_exclusions:
    - "%LOCALAPPDATA%\\MaxAgent"
    - "C:\\Install"
