[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "max-vm-auto"
version = "0.1.0"
description = "CLI & AutoHotkey v2 automation toolkit for testing 3ds Max 2025 installation and setup on Hyper-V VM"
requires-python = ">=3.10"
dependencies = [
    "uiautomation>=2.0.18",
    "PyYAML>=6.0.1",
    "click>=8.1.7",
    "Pillow>=10.2.0",
    "psutil>=5.9.8",
]

[project.scripts]
max-auto = "cli.main:cli"

[tool.setuptools]
packages = ["cli"]

